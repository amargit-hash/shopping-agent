<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMate · Personal Shopping Agent</title>
<style>
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --border: #e7e8ef;
    --text: #111827;
    --muted: #6b7280;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-soft: #eef2ff;
    --success: #059669;
    --success-soft: #d1fae5;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
    --shadow: 0 4px 16px rgba(16, 24, 40, .08);
    --shadow-lg: 0 18px 40px rgba(16, 24, 40, .16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:disabled { cursor: not-allowed; }
  input, select { font: inherit; color: inherit; }
  svg { display: block; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(120deg, #4338ca 0%, #6d28d9 55%, #9333ea 100%);
    color: #fff; box-shadow: 0 2px 12px rgba(67, 56, 202, .3);
  }
  .header-inner {
    max-width: 1440px; margin: 0 auto; padding: 14px 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .25);
  }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 12px; opacity: .8; }
  .header-spacer { flex: 1; }
  .conn {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    background: rgba(255, 255, 255, .14); padding: 6px 12px; border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; }
  .dot.ok { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .3); }
  .dot.err { background: #f87171; }
  .cart-btn {
    position: relative; display: flex; align-items: center; gap: 8px;
    background: #fff; color: var(--primary); font-weight: 600;
    padding: 9px 16px; border-radius: 999px; transition: transform .15s;
  }
  .cart-btn:hover { transform: translateY(-1px); }
  .cart-count {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    background: var(--primary); color: #fff; font-size: 12px; display: grid; place-items: center;
  }
  .cart-btn.bump { animation: bump .4s; }
  @keyframes bump { 30% { transform: scale(1.12); } }

  /* ---------- Layout ---------- */
  .layout {
    max-width: 1440px; margin: 0 auto; padding: 24px 28px 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) 480px; gap: 24px; align-items: start;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
  }

  /* ---------- Search & filters ---------- */
  .search-panel { padding: 20px; margin-bottom: 20px; }
  .search-box {
    display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 50px;
    border: 1.5px solid var(--border); border-radius: 12px; background: #fafbff;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); background: #fff; }
  .search-box input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; }
  .search-box svg { color: var(--muted); }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 999px; border: 1px solid var(--border); background: #fff;
    font-weight: 500; color: #374151; transition: all .15s; text-transform: capitalize;
  }
  .chip:hover { border-color: #c7c9ff; background: var(--primary-soft); }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip .count { font-size: 11px; opacity: .7; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
  .control { display: flex; align-items: center; gap: 10px; color: #374151; font-weight: 500; }
  .control label { color: var(--muted); font-weight: 500; }
  .price-control input[type=range] { width: 180px; accent-color: var(--primary); }
  .price-value { min-width: 92px; font-weight: 600; color: var(--primary); }
  select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; outline: none;
  }
  select:focus { border-color: var(--primary); }
  .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .toggle input { display: none; }
  .switch { width: 38px; height: 22px; border-radius: 999px; background: #d1d5db; position: relative; transition: background .2s; }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s;
  }
  .toggle input:checked + .switch { background: var(--primary); }
  .toggle input:checked + .switch::after { transform: translateX(16px); }

  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 4px 14px; }
  .results-head h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .results-head span { color: var(--muted); }

  /* ---------- Product cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
    animation: fadeUp .35s ease both;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: transparent; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
  .card-media { position: relative; cursor: pointer; }
  .thumb { display: grid; place-items: center; color: rgba(255, 255, 255, .95); position: relative; overflow: hidden; }
  .thumb::before {
    content: ""; position: absolute; width: 140%; height: 140%; top: -70%; right: -60%;
    background: radial-gradient(circle, rgba(255, 255, 255, .28), transparent 60%);
  }
  .thumb svg { position: relative; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .15)); }
  .thumb.lg { height: 150px; }
  .thumb.xl { height: 190px; }
  .thumb.sm { width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0; }
  .card-media .thumb svg { transition: transform .25s ease; }
  .card:hover .card-media .thumb svg { transform: scale(1.08) rotate(-3deg); }
  .overlay-badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .badge.id { background: rgba(17, 24, 39, .45); color: #fff; backdrop-filter: blur(4px); }
  .badge.in { background: var(--success-soft); color: var(--success); }
  .badge.out { background: var(--danger-soft); color: var(--danger); }
  .badge.over { background: var(--warn-soft); color: var(--warn); }
  .badge-stack { display: flex; gap: 6px; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-brand { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card-title { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; min-height: 39px; }
  .rating { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .stars { position: relative; display: inline-block; font-size: 14px; letter-spacing: 1px; line-height: 1; }
  .stars-bg { color: #e5e7eb; }
  .stars-fill { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: #f59e0b; }
  .card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .price { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .price small { font-size: 13px; font-weight: 600; color: var(--muted); }
  .card-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    border: 1px solid var(--border); color: #4b5563; transition: all .15s; background: #fff;
  }
  .icon-btn:hover { background: #f3f4f6; color: var(--text); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 14px; border-radius: 10px; font-weight: 600; transition: all .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(79, 70, 229, .3); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
  .btn-primary:disabled { background: #e5e7eb; color: #9ca3af; box-shadow: none; }
  .btn-ghost { border: 1px solid var(--border); background: #fff; color: #374151; }
  .btn-ghost:hover { background: #f9fafb; }
  .btn-block { width: 100%; height: 44px; font-size: 15px; }

  .load-more { display: flex; justify-content: center; margin-top: 24px; }
  .load-more-btn { height: 44px; padding: 0 26px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow-sm); }
  .load-more-btn:hover:not(:disabled) { border-color: #c7c9ff; color: var(--primary); background: var(--primary-soft); }
  .skeleton { border-radius: var(--radius); height: 300px; background: linear-gradient(90deg, #eceef4 25%, #f6f7fb 50%, #eceef4 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty svg { margin: 0 auto 12px; color: #c7c9d9; }
  .empty h3 { color: var(--text); margin: 0 0 6px; }

  /* ---------- Sidebar ---------- */
  .sidebar { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 20px; height: calc(100vh - 116px); }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { margin: 0; font-size: 15px; }
  .panel-head p { margin: 0; font-size: 12px; color: var(--muted); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
  }
  .avatar.sm { width: 28px; height: 28px; }

  /* Zero basis: the chat fills whatever the cart leaves, however long the history gets. */
  .chat { display: flex; flex-direction: column; flex: 1 1 0; min-height: 360px; }
  .chat-head-actions { margin-left: auto; display: flex; gap: 6px; }
  .chat-head-actions .icon-btn { width: 34px; height: 34px; }
  .chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: #fbfbfe; }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; animation: fadeUp .25s ease both; }
  .msg-row.you { justify-content: flex-end; }
  .msg-col { display: flex; flex-direction: column; gap: 3px; max-width: 88%; min-width: 0; }
  .msg-row.you .msg-col { align-items: flex-end; }
  .msg-time { font-size: 11px; color: #9ca3af; padding: 0 6px; }
  .bubble { padding: 11px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .msg-row.you .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg-row.agent .bubble {
    background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.6;
  }
  .msg-row.agent .bubble.plain { font-family: inherit; font-size: 15px; }
  .history-divider {
    display: flex; align-items: center; gap: 10px; font-size: 11px; color: #9ca3af;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .history-divider::before, .history-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* Expanded chat: large centered panel over the page. */
  .chat-backdrop { position: fixed; inset: 0; z-index: 54; background: rgba(17, 24, 39, .45); backdrop-filter: blur(3px); display: none; }
  body.chat-open .chat-backdrop { display: block; animation: fade .2s; }
  body.chat-open { overflow: hidden; }
  /* The sticky sidebar forms its own stacking context, so it must rise above the backdrop. */
  body.chat-open .sidebar { z-index: 56; }
  body.chat-open .cart-panel { visibility: hidden; }
  .chat.expanded {
    position: fixed; z-index: 55; top: 4vh; left: 50%; transform: translateX(-50%);
    width: min(1000px, 94vw); height: 92vh; box-shadow: var(--shadow-lg); animation: pop .25s ease;
  }
  .chat.expanded .chat-log { padding: 24px 28px; gap: 16px; }
  .chat.expanded .msg-col { max-width: 78%; }
  .chat.expanded .bubble { font-size: 16px; }
  .chat.expanded .msg-row.agent .bubble { font-size: 14px; }
  .chat.expanded .chat-form input { height: 50px; font-size: 16px; }
  .chat.expanded .send-btn { width: 50px; height: 50px; }
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #a5b4fc; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .suggestions { display: flex; gap: 6px; padding: 10px 14px 0; overflow-x: auto; scrollbar-width: none; }
  .suggestions::-webkit-scrollbar { display: none; }
  .suggestion {
    flex-shrink: 0; font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary); font-weight: 500; transition: background .15s;
  }
  .suggestion:hover { background: #e0e7ff; }
  .chat-form { display: flex; gap: 8px; padding: 12px 14px 14px; }
  .chat-form input {
    flex: 1; height: 42px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .chat-form input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .send-btn { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--primary); color: #fff; transition: background .15s; }
  .send-btn:hover { background: var(--primary-dark); }

  .cart-panel { flex: 0 0 auto; max-height: 45%; display: flex; flex-direction: column; min-height: 0; }
  .cart-panel.flash { animation: flash 1s; }
  @keyframes flash { 30% { box-shadow: 0 0 0 4px #c7d2fe; } }
  .profile { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px 0; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #f3f4f6; color: #374151; }
  .pill b { font-weight: 600; }
  .cart-items { flex: 1 1 auto; overflow-y: auto; padding: 8px 18px; min-height: 76px; }
  .cart-panel .panel-head, .cart-panel .profile, .cart-foot { flex-shrink: 0; }
  .cart-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .cart-item:last-child { border-bottom: none; }
  .cart-info { flex: 1; min-width: 0; }
  .cart-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-sub { font-size: 12px; color: var(--muted); }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty button { width: 26px; height: 26px; color: #4b5563; }
  .qty button:hover { background: #f3f4f6; }
  .qty span { min-width: 22px; text-align: center; font-weight: 600; font-size: 13px; }
  .cart-price { font-weight: 700; font-size: 13px; min-width: 64px; text-align: right; }
  .cart-empty { text-align: center; color: var(--muted); padding: 22px 0 18px; }
  .cart-empty svg { margin: 0 auto 8px; color: #c7c9d9; }
  .cart-foot { padding: 12px 18px 16px; border-top: 1px solid var(--border); }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .total-row span { color: var(--muted); }
  .total-row strong { font-size: 22px; letter-spacing: -.02em; }

  /* ---------- Modal ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 50; background: rgba(17, 24, 39, .5); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .backdrop.open { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    width: 560px; max-width: 100%; max-height: 92vh; overflow-y: auto; background: #fff;
    border-radius: 18px; box-shadow: var(--shadow-lg); animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.96) translateY(10px); opacity: 0; } }
  .modal .thumb.xl { border-radius: 18px 18px 0 0; }
  .modal-close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(255, 255, 255, .9); color: var(--text);
  }
  .modal-body { padding: 20px 24px 24px; }
  .modal-body h3 { margin: 4px 0 8px; font-size: 21px; letter-spacing: -.01em; }
  .modal-body .desc { color: #4b5563; margin: 12px 0 16px; }
  .modal-price { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
  .modal-price .price { font-size: 28px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .spec { background: #f9fafb; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .spec dt { font-size: 11px; color: var(--muted); text-transform: capitalize; }
  .spec dd { margin: 2px 0 0; font-weight: 600; }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-radius: 12px;
    background: #111827; color: #fff; box-shadow: var(--shadow-lg); font-weight: 500;
    animation: toastIn .3s ease both; max-width: 90vw;
  }
  .toast.success svg { color: #34d399; }
  .toast.warn svg { color: #fbbf24; }
  .toast.hide { animation: toastOut .3s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(12px); } }

  /* ---------- Responsive ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: static; height: auto; }
    .chat { height: 640px; }
    .cart-panel { max-height: none; }
  }
  @media (max-width: 640px) {
    .header-inner, .layout { padding-left: 14px; padding-right: 14px; }
    .brand p, .conn { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .chat-form input { min-width: 0; }
    .controls { gap: 12px; }
    .price-control input[type=range] { width: 130px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div>
        <h1>ShopMate</h1>
        <p>Your personal shopping agent</p>
      </div>
    </div>
    <div class="header-spacer"></div>
    <div class="conn"><span class="dot" id="conn-dot"></span><span class="conn-text" id="conn-text">Connecting…</span></div>
    <button class="cart-btn" id="cart-btn"><span id="cart-btn-icon"></span>Cart <span class="cart-count" id="cart-count">0</span></button>
  </div>
</header>

<div class="layout">
  <main>
    <section class="panel search-panel">
      <div class="search-box">
        <span id="search-icon"></span>
        <input id="f-query" placeholder="Search products, brands or features (e.g. wireless, running, espresso)" autocomplete="off">
      </div>
      <div class="chips-row" id="category-chips"></div>
      <div class="controls">
        <div class="control price-control">
          <label for="f-max">Max price</label>
          <input id="f-max" type="range" min="0" max="1600" step="10" value="1600">
          <span class="price-value" id="f-max-label">Any price</span>
        </div>
        <div class="control">
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="rating">Top rated</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="popularity">Most popular</option>
          </select>
        </div>
        <label class="toggle control"><input type="checkbox" id="f-stock"><span class="switch"></span>In stock only</label>
      </div>
    </section>

    <div class="results-head">
      <h2 id="results-title">All products</h2>
      <span id="results-count"></span>
    </div>
    <div class="grid" id="results"></div>
    <div class="load-more" id="load-more"></div>
  </main>

  <aside class="sidebar">
    <section class="panel chat" id="chat">
      <div class="panel-head">
        <div class="avatar" id="agent-avatar"></div>
        <div>
          <h2>Shopping assistant</h2>
          <p>Ask for recommendations, comparisons, or set a budget</p>
        </div>
        <div class="chat-head-actions">
          <button class="icon-btn" type="button" id="chat-clear" title="Clear chat history"></button>
          <button class="icon-btn" type="button" id="chat-expand" title="Expand chat"></button>
        </div>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" placeholder="e.g. recommend headphones under 300" autocomplete="off">
        <button class="send-btn" type="submit" id="send-btn" title="Send"></button>
      </form>
    </section>

    <section class="panel cart-panel" id="cart-panel">
      <div class="panel-head">
        <div>
          <h2>Your cart</h2>
          <p id="cart-summary">No items yet</p>
        </div>
      </div>
      <div class="profile" id="profile"></div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-foot" id="cart-foot"></div>
    </section>
  </aside>
</div>

<div class="chat-backdrop" id="chat-backdrop"></div>
<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);

// Inline SVG icons (static strings only; all dynamic text goes through textContent).
const ICON_PATHS = {
  headphones: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
  laptops: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  phones: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  shoes: '<path d="M2 15.5V9l4.5 1.5L9 8l5 5 5.5 1.3A2.5 2.5 0 0 1 22 16.7V18H2z"/><path d="M2 18h20"/><path d="M11 11l1.5-1.5M13 13l1.5-1.5"/>',
  kitchen: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M7 2v3M10 2v3M13 2v3"/>',
  electronics: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
  tablets: '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/>',
  cameras: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  watches: '<circle cx="12" cy="12" r="6"/><path d="M12 10v2l1 1"/><path d="m16.1 16.8-.5 4.2a2 2 0 0 1-2 1.8h-3.2a2 2 0 0 1-2-1.8l-.5-4.2M7.9 7.2l.5-4.2a2 2 0 0 1 2-1.8h3.2a2 2 0 0 1 2 1.8l.5 4.2"/>',
  gaming: '<rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4M8 10v4"/><path d="M15 11h.01M18 13h.01"/>',

  fitness: '<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
  clothing: '<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2z"/>',
  beauty: '<path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.3 0z"/>',
  books: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  toys: '<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  maximize: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  minimize: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
};
const THEMES = {
  headphones: ['#6366f1', '#a855f7'],
  laptops: ['#0ea5e9', '#6366f1'],
  phones: ['#10b981', '#0891b2'],
  shoes: ['#f97316', '#e11d48'],
  kitchen: ['#f59e0b', '#ea580c'],
  electronics: ['#8b5cf6', '#db2777'],
  tablets: ['#06b6d4', '#3b82f6'],
  cameras: ['#334155', '#0f172a'],
  watches: ['#14b8a6', '#0f766e'],
  gaming: ['#7c3aed', '#1e1b4b'],
  home: ['#22c55e', '#15803d'],
  fitness: ['#ef4444', '#b91c1c'],
  clothing: ['#64748b', '#1e3a8a'],
  beauty: ['#f472b6', '#c026d3'],
  books: ['#a16207', '#78350f'],
  toys: ['#facc15', '#f97316'],
};

function svg(name, size = 18, stroke = 2) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ICON_PATHS.bag}</svg>`;
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'style') node.style.cssText = v;
    else if (k === 'icon') node.innerHTML = v;
    else if (k.startsWith('on') || k in node) node[k] = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c);
  return node;
}

function thumb(category, size) {
  const [a, b] = THEMES[category] || ['#64748b', '#334155'];
  const px = { sm: 22, lg: 64, xl: 84 }[size];
  return el('div', { class: `thumb ${size}`, style: `background: linear-gradient(135deg, ${a}, ${b})`, icon: svg(category, px, 1.5) });
}

function stars(rating) {
  return el('span', { class: 'stars', title: `${rating} out of 5` },
    el('span', { class: 'stars-bg', textContent: '★★★★★' }),
    el('span', { class: 'stars-fill', style: `width:${(rating / 5) * 100}%`, textContent: '★★★★★' }));
}

const money = (n) => '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const callTool = (name, args) => api('/api/tool', { name, arguments: args });

let state = { budget: null, cart: [], preferences: [] };
let activeCategory = '';
let priceCeiling = 1600;
let searchSeq = 0;
const productCache = {};

// ---------------- Catalog ----------------

function renderCategoryChips(categories) {
  const row = $('category-chips');
  row.replaceChildren();
  const total = Object.values(categories).reduce((s, c) => s + c.count, 0);
  const entries = [['', { count: total }], ...Object.entries(categories)];
  for (const [name, info] of entries) {
    const chip = el('button', { class: 'chip' + (name === activeCategory ? ' active' : ''), type: 'button' });
    chip.innerHTML = svg(name || 'grid', 15, 2);
    chip.append(name || 'All', el('span', { class: 'count', textContent: info.count }));
    chip.onclick = () => { activeCategory = name; renderCategoryChips(categories); search(); };
    row.append(chip);
  }
}

function priceLabel() {
  const v = Number($('f-max').value);
  return v >= priceCeiling ? 'Any price' : 'Up to ' + money(v).replace('.00', '');
}

const PAGE_SIZE = 48;
let currentArgs = null;
let loadedCount = 0;
let totalCount = 0;

async function search() {
  const seq = ++searchSeq;
  const args = { sort_by: $('f-sort').value, limit: PAGE_SIZE, offset: 0 };
  const q = $('f-query').value.trim(); if (q) args.query = q;
  if (activeCategory) args.category = activeCategory;
  const max = Number($('f-max').value); if (max < priceCeiling) args.max_price = max;
  if ($('f-stock').checked) args.in_stock_only = true;
  currentArgs = args;

  $('results-title').textContent = activeCategory ? activeCategory[0].toUpperCase() + activeCategory.slice(1) : (q ? 'Search results' : 'All products');
  $('results').replaceChildren(...Array.from({ length: 8 }, () => el('div', { class: 'skeleton' })));
  $('load-more').replaceChildren();
  try {
    const data = await callTool('search_products', args);
    if (seq !== searchSeq) return;
    data.products.forEach((p) => { productCache[p.id] = p; });
    loadedCount = data.count;
    totalCount = data.total ?? data.count;
    renderProducts(data.products);
    updateResultsFooter();
  } catch (e) {
    if (seq !== searchSeq) return;
    $('results').replaceChildren(emptyState('Could not load products', e.message));
  }
}

async function loadMore() {
  const seq = searchSeq;
  const btn = $('load-more').querySelector('button');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  try {
    const data = await callTool('search_products', { ...currentArgs, offset: loadedCount });
    if (seq !== searchSeq) return;
    data.products.forEach((p) => { productCache[p.id] = p; });
    $('results').append(...data.products.map((p, i) => productCard(p, i)));
    loadedCount += data.count;
    updateResultsFooter();
  } catch (e) {
    toast(e.message, 'warn');
    updateResultsFooter();
  }
}

function updateResultsFooter() {
  $('results-count').textContent = totalCount
    ? `Showing ${loadedCount.toLocaleString()} of ${totalCount.toLocaleString()} items`
    : '0 items';
  const box = $('load-more');
  box.replaceChildren();
  if (loadedCount < totalCount) {
    const remaining = totalCount - loadedCount;
    const btn = el('button', { class: 'btn btn-ghost load-more-btn', type: 'button',
      textContent: `Load ${Math.min(PAGE_SIZE, remaining)} more · ${remaining.toLocaleString()} left` });
    btn.onclick = loadMore;
    box.append(btn);
  }
}

function emptyState(title, text) {
  const box = el('div', { class: 'empty', icon: svg('search', 44, 1.5) });
  box.append(el('h3', { textContent: title }), el('div', { textContent: text }));
  return box;
}

function renderProducts(products) {
  const grid = $('results');
  if (!products.length) {
    grid.replaceChildren(emptyState('No products found', 'Try a different keyword, category or a higher max price.'));
    return;
  }
  grid.replaceChildren(...products.map((p, i) => productCard(p, i)));
}

function productCard(p, index) {
  const status = [];
  if (!p.in_stock) status.push(el('span', { class: 'badge out', textContent: 'Out of stock' }));
  if (state.budget != null && p.price > state.budget) status.push(el('span', { class: 'badge over', textContent: 'Over budget' }));

  const media = el('div', { class: 'card-media', title: 'View details' },
    thumb(p.category, 'lg'),
    el('div', { class: 'overlay-badges' },
      el('span', { class: 'badge id', textContent: p.id }),
      el('div', { class: 'badge-stack' }, ...status)));
  media.onclick = () => showDetail(p.id);

  const details = el('button', { class: 'icon-btn', title: 'Details', icon: svg('eye', 17) });
  details.onclick = () => showDetail(p.id);
  const add = el('button', { class: 'btn btn-primary', disabled: !p.in_stock, title: p.in_stock ? 'Add to cart' : 'Out of stock', icon: svg('plus', 16, 2.5) });
  add.append('Add');
  add.onclick = () => cartAction('add ' + p.id);

  return el('article', { class: 'card', style: `animation-delay:${Math.min(index, 12) * 30}ms` },
    media,
    el('div', { class: 'card-body' },
      el('div', { class: 'card-brand', textContent: p.brand }),
      el('h3', { class: 'card-title', textContent: p.name }),
      el('div', { class: 'rating' }, stars(p.rating), el('span', { textContent: p.rating.toFixed(1) })),
      el('div', { class: 'card-foot' },
        el('div', { class: 'price', textContent: money(p.price) }),
        el('div', { class: 'card-actions' }, details, add))));
}

async function showDetail(id) {
  const modal = $('modal');
  let data;
  try { data = await callTool('get_product', { product_id: id }); }
  catch (e) { toast(e.message, 'warn'); return; }
  if (data.error) { toast(data.error, 'warn'); return; }
  const p = data.product;
  productCache[p.id] = { ...productCache[p.id], ...p };

  const close = el('button', { class: 'modal-close', title: 'Close', icon: svg('x', 18) });
  close.onclick = closeModal;
  const head = el('div', { style: 'position:relative' }, thumb(p.category, 'xl'), close);

  const stock = p.stock > 0
    ? el('span', { class: 'badge in', textContent: `${p.stock} in stock` })
    : el('span', { class: 'badge out', textContent: 'Out of stock' });
  const overBudget = state.budget != null && p.price > state.budget
    ? el('span', { class: 'badge over', textContent: `${money(p.price - state.budget)} over budget` }) : null;

  const specs = el('dl', { class: 'specs' },
    ...Object.entries(p.specs).map(([k, v]) =>
      el('div', { class: 'spec' }, el('dt', { textContent: k.replaceAll('_', ' ') }), el('dd', { textContent: String(v) }))));

  const add = el('button', { class: 'btn btn-primary btn-block', disabled: !p.stock, icon: svg('cart', 18) });
  add.append(p.stock ? `Add to cart · ${money(p.price)}` : 'Out of stock');
  add.onclick = () => { closeModal(); cartAction('add ' + p.id); };

  modal.replaceChildren(head, el('div', { class: 'modal-body' },
    el('div', { class: 'card-brand', textContent: `${p.brand} · ${p.category}` }),
    el('h3', { textContent: p.name }),
    el('div', { class: 'rating' }, stars(p.rating), el('span', { textContent: `${p.rating.toFixed(1)} · ${p.reviews.toLocaleString()} reviews` })),
    el('div', { class: 'modal-price' }, el('div', { class: 'price', textContent: money(p.price) }), el('div', { class: 'badge-stack' }, overBudget, stock)),
    el('p', { class: 'desc', textContent: p.description }),
    el('div', { class: 'tags' }, ...p.tags.map((t) => el('span', { class: 'tag', textContent: t }))),
    specs,
    add));
  $('backdrop').classList.add('open');
}

function closeModal() { $('backdrop').classList.remove('open'); }
$('backdrop').onclick = (e) => { if (e.target.id === 'backdrop') closeModal(); };
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('backdrop').classList.contains('open')) closeModal();
  else if ($('chat').classList.contains('expanded')) setChatExpanded(false);
});

// ---------------- Chat ----------------

const GREETING = "Hi! I'm your personal shopping assistant. Browse the catalog, or ask me for recommendations, comparisons, or to set a budget.";

function formatTime(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function addMessage(who, text, plain = false, time = null) {
  const log = $('chat-log');
  const row = el('div', { class: 'msg-row ' + who });
  if (who === 'agent') row.append(el('div', { class: 'avatar sm', icon: svg('sparkle', 15) }));
  row.append(el('div', { class: 'msg-col' },
    el('div', { class: 'bubble' + (plain ? ' plain' : ''), textContent: text }),
    el('div', { class: 'msg-time', textContent: formatTime(time) })));
  log.append(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function resetChat(messages = []) {
  $('chat-log').replaceChildren();
  addMessage('agent', GREETING, true, messages[0]?.time);
  if (messages.length) {
    $('chat-log').append(el('div', { class: 'history-divider', textContent: `Earlier in this session · ${messages.length} messages` }));
  }
  // Short single-line agent replies read better in the normal font; tables keep monospace.
  for (const m of messages) addMessage(m.role, m.text, m.role === 'you' || !m.text.includes('\n'), m.time);
}

async function loadHistory() {
  try {
    const data = await api('/api/history');
    resetChat(data.messages);
  } catch (e) {
    resetChat();
  }
}

$('chat-clear').onclick = async () => {
  if (!confirm('Clear the chat history for this session?')) return;
  await api('/api/history/clear', {});
  resetChat();
  toast('Chat history cleared');
};

function setChatExpanded(open) {
  $('chat').classList.toggle('expanded', open);
  document.body.classList.toggle('chat-open', open);
  $('chat-expand').innerHTML = svg(open ? 'minimize' : 'maximize', 17);
  $('chat-expand').title = open ? 'Shrink chat' : 'Expand chat';
  $('chat-log').scrollTop = $('chat-log').scrollHeight;
  if (open) $('chat-input').focus();
}
$('chat-expand').onclick = () => setChatExpanded(!$('chat').classList.contains('expanded'));
$('chat-backdrop').onclick = () => setChatExpanded(false);

function showTyping() {
  const row = el('div', { class: 'msg-row agent' },
    el('div', { class: 'avatar sm', icon: svg('sparkle', 15) }),
    el('div', { class: 'bubble plain typing' }, el('span'), el('span'), el('span')));
  $('chat-log').append(row);
  $('chat-log').scrollTop = $('chat-log').scrollHeight;
  return row;
}

async function sendChat(message) {
  if (!message.trim()) return;
  addMessage('you', message, true);
  const typing = showTyping();
  try {
    const data = await api('/api/chat', { message });
    typing.remove();
    if (data.reply) addMessage('agent', data.reply, !data.reply.includes('\n'));
    applyState(data.state);
  } catch (e) {
    typing.remove();
    addMessage('agent', 'Error: ' + e.message, true);
  }
}

// Cart actions from buttons go through the agent too, but show a toast instead of cluttering the chat.
async function cartAction(message) {
  try {
    const data = await api('/api/chat', { message, record: false });
    const ok = /^(Added|Removed|Your cart|Order placed)/.test(data.reply) || data.reply.includes('Order placed');
    toast(data.reply.split('\n').pop(), ok ? 'success' : 'warn');
    applyState(data.state);
  } catch (e) {
    toast(e.message, 'warn');
  }
}

$('chat-form').onsubmit = (e) => {
  e.preventDefault();
  sendChat($('chat-input').value);
  $('chat-input').value = '';
};

for (const s of ['recommend headphones', 'budget 300', 'prefer wireless, travel', 'gaming laptop under 1500',
                 'recommend a watch for running', 'cheapest espresso machine', 'compare P001 P002 P003', 'help']) {
  const b = el('button', { class: 'suggestion', type: 'button', textContent: s });
  b.onclick = () => sendChat(s);
  $('suggestions').append(b);
}

// ---------------- Toasts ----------------

function toast(text, kind = 'success') {
  const t = el('div', { class: 'toast ' + kind, icon: svg(kind === 'success' ? 'check' : 'alert', 18, 2.5) });
  t.append(text);
  $('toasts').append(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 300); }, 3000);
}

// ---------------- Cart & profile ----------------

function applyState(s) {
  const budgetChanged = s.budget !== state.budget;
  const prevCount = state.cart.reduce((n, i) => n + i.quantity, 0);
  state = s;
  const count = s.cart.reduce((n, i) => n + i.quantity, 0);

  $('cart-count').textContent = count;
  if (count !== prevCount) {
    $('cart-btn').classList.remove('bump'); void $('cart-btn').offsetWidth; $('cart-btn').classList.add('bump');
  }
  $('cart-summary').textContent = count ? `${count} item${count === 1 ? '' : 's'}` : 'No items yet';

  const profile = $('profile');
  profile.replaceChildren(
    el('span', { class: 'pill' }, 'Budget: ', el('b', { textContent: s.budget == null ? 'not set' : money(s.budget) })),
    ...(s.preferences.length
      ? s.preferences.map((p) => el('span', { class: 'pill', textContent: p }))
      : [el('span', { class: 'pill', textContent: 'No preferences' })]));

  renderCart(s);
  if (budgetChanged) search();
}

function renderCart(s) {
  const items = $('cart-items');
  const foot = $('cart-foot');
  if (!s.cart.length) {
    const empty = el('div', { class: 'cart-empty', icon: svg('cart', 36, 1.5) });
    empty.append(el('div', { textContent: 'Your cart is empty' }));
    items.replaceChildren(empty);
    foot.replaceChildren();
  } else {
    items.replaceChildren(...s.cart.map((item) => {
      const minus = el('button', { title: item.quantity > 1 ? 'Decrease' : 'Remove', icon: svg(item.quantity > 1 ? 'minus' : 'trash', 13, 2.5) });
      minus.onclick = () => item.quantity > 1 ? cartAction(`remove ${item.id} x1`) : cartAction('remove ' + item.id);
      const plus = el('button', { title: 'Increase', icon: svg('plus', 13, 2.5) });
      plus.onclick = () => cartAction('add ' + item.id);
      return el('div', { class: 'cart-item' },
        thumb(item.category || productCache[item.id]?.category, 'sm'),
        el('div', { class: 'cart-info' },
          el('div', { class: 'cart-name', textContent: item.name, title: item.name }),
          el('div', { class: 'cart-sub', textContent: money(item.unit_price) + ' each' })),
        el('div', { class: 'qty' }, minus, el('span', { textContent: item.quantity }), plus),
        el('div', { class: 'cart-price', textContent: money(item.subtotal) }));
    }));
    const checkout = el('button', { class: 'btn btn-primary btn-block' });
    checkout.textContent = 'Checkout';
    checkout.onclick = () => sendChat('checkout');
    foot.replaceChildren(
      el('div', { class: 'total-row' }, el('span', { textContent: 'Total' }), el('strong', { textContent: money(s.total) })),
      checkout);
  }
}

$('cart-btn').onclick = () => {
  const panel = $('cart-panel');
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  panel.classList.remove('flash'); void panel.offsetWidth; panel.classList.add('flash');
};

// ---------------- Init ----------------

$('logo').innerHTML = svg('bag', 22, 2);
$('cart-btn-icon').innerHTML = svg('cart', 17, 2.2);
$('search-icon').innerHTML = svg('search', 20, 2);
$('send-btn').innerHTML = svg('send', 18, 2.2);
$('agent-avatar').innerHTML = svg('sparkle', 18, 2);
$('chat-clear').innerHTML = svg('trash', 16);
$('chat-expand').innerHTML = svg('maximize', 17);

const debouncedSearch = debounce(search, 250);
$('f-query').addEventListener('input', debouncedSearch);
$('f-max').addEventListener('input', () => { $('f-max-label').textContent = priceLabel(); debouncedSearch(); });
$('f-sort').addEventListener('change', search);
$('f-stock').addEventListener('change', search);

(async () => {
  try {
    const s = await api('/api/state');
    $('conn-dot').classList.add('ok');
    $('conn-text').textContent = `MCP connected · ${s.tools.length} tools`;
    $('conn-text').parentElement.title = s.server;
    const maxPrice = Math.max(...Object.values(s.categories).map((c) => c.max_price));
    priceCeiling = Math.ceil(maxPrice / 100) * 100;
    $('f-max').max = priceCeiling;
    $('f-max').value = priceCeiling;
    renderCategoryChips(s.categories);
    applyState(s);
    search();
    await loadHistory();
  } catch (e) {
    $('conn-dot').classList.add('err');
    $('conn-text').textContent = 'Not connected';
    $('results').replaceChildren(emptyState('Cannot reach the shopping agent', 'Start product_server.py, then agent_ui.py, and refresh this page.'));
  }
})();
</script>
</body>
</html>
